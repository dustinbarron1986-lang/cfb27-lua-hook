name: focused-coordinator-validation

on: [push]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/football-pre-snap-audible.test.cjs tests/football-defensive-recommendation.test.cjs tests/football-coordinator-window-ui.test.cjs
