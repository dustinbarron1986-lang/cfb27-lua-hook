name: focused-coordinator-validation

on: [push]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/football-pre-snap-audible.test.cjs
      - run: node --test --test-name-pattern="unknown-concept cold start|defensive family repetition|strong situation evidence|unknown-concept defensive ranking|repetition penalty works|unknown offensive play degrades gracefully" tests/football-defensive-recommendation.test.cjs
      - run: node --test --test-name-pattern="showSelection preserves|render\(\) shows audible|titleForPhase maps|render\(\) sets the in-page" tests/football-coordinator-window-ui.test.cjs
